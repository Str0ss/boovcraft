[project]
name = "boovcraft-processor"
version = "0.2.0"
description = "Processor layer: reads a Parser-layer JSON and emits visualizer-ready analysis JSON, plus a narrative-events JSON via extract_events.py."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
summarize = ["anthropic>=0.40.0,<1.0.0"]

[tool.setuptools]
py-modules = ["analyze", "extract_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
